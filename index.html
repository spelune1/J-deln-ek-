<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jídelníček MŠ Halasova</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #e0e7ff;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --today-bg: #ecfdf5;
            --today-border: #10b981;
            --today-badge: #059669;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            line-height: 1.5;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 20px 16px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 1.4rem;
            color: var(--primary);
        }

        .date-range {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .day-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 2px solid transparent;
            transition: transform 0.2s;
        }

        .day-card.today {
            background: var(--today-bg);
            border-color: var(--today-border);
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .day-card.today .day-header {
            border-bottom-color: #a7f3d0;
        }

        .day-title {
            font-weight: 700;
            font-size: 1.15rem;
            margin: 0;
        }

        .today-badge {
            background: var(--today-badge);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .meal-row {
            margin-bottom: 10px;
        }

        .meal-row:last-child {
            margin-bottom: 0;
        }

        .meal-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            display: block;
            margin-bottom: 2px;
        }

        .day-card.today .meal-label {
            color: #047857;
        }

        .meal-text {
            font-size: 1rem;
            margin: 0;
        }

        .status-box {
            text-align: center;
            padding: 32px 16px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .error-box {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
        }

        .btn-refresh {
            display: block;
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 16px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .btn-refresh:active {
            transform: scale(0.98);
        }

        .btn-link {
            display: inline-block;
            margin-top: 12px;
            color: #991b1b;
            font-weight: 600;
            text-decoration: underline;
            font-size: 0.9rem;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid var(--primary-light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🍽️ Jídelníček MŠ Halasova</h1>
        <div id="date-range" class="date-range">Načítám termín...</div>
    </header>

    <div id="content">
        <div class="status-box">
            <div class="spinner"></div>
            <div>Stahuji aktuální jídelníček ze stránek školky...</div>
        </div>
    </div>

    <button class="btn-refresh" onclick="loadMenu()">🔄 Aktualizovat jídelníček</button>
</div>

<script>
    const TARGET_URL = 'https://www.ms-halasova.cz/jidelnicek/';

    // Seznam záložních bran (CORS proxy) pro případ, že jedna z nich zrovna vypadne
    const PROXIES = [
        url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
        url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
        url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
    ];

    function cleanText(text) {
        if (!text) return '';
        let cleaned = text.replace(/\(\s*\d+(?:\s*,\s*\d+)*\s*\)/g, '');
        cleaned = cleaned.replace(/\s+/g, ' ').trim();
        if (cleaned.length > 0) {
            cleaned = cleaned.charAt(0).toUpperCase() + cleaned.slice(1).toLowerCase();
            cleaned = cleaned.replace(/\bčr\b/gi, 'ČR').replace(/\bio\b/gi, 'IO');
        }
        return cleaned;
    }

    function getTodayName() {
        const days = ['Neděle', 'Pondělí', 'Úterý', 'Středa', 'Čtvrtek', 'Pátek', 'Sobota'];
        return days[new Date().getDay()];
    }

    async function fetchWithFallback(url) {
        let lastError = null;
        for (const makeProxyUrl of PROXIES) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);
                
                const response = await fetch(makeProxyUrl(url), { signal: controller.signal });
                clearTimeout(timeoutId);
                
                if (response.ok) {
                    const text = await response.text();
                    if (text && text.includes('Pondělí')) {
                        return text;
                    }
                }
            } catch (err) {
                lastError = err;
            }
        }
        throw lastError || new Error('Všechny stahovací brány jsou momentálně nedostupné.');
    }

    async function loadMenu() {
        const contentDiv = document.getElementById('content');
        const dateRangeDiv = document.getElementById('date-range');
        
        contentDiv.innerHTML = `
            <div class="status-box">
                <div class="spinner"></div>
                <div>Stahuji aktuální jídelníček ze stránek školky...</div>
            </div>
        `;
        dateRangeDiv.textContent = 'Načítám termín...';

        try {
            const htmlText = await fetchWithFallback(TARGET_URL);
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlText, 'text/html');

            const bodyText = doc.body.innerText;
            const dateMatch = bodyText.match(/(\d{1,2}\.\s*\d{1,2}\.\s*[-–]\s*\d{1,2}\.\s*\d{1,2}\.\s*\d{4})/);
            dateRangeDiv.textContent = dateMatch ? `Termín: ${dateMatch[1]}` : 'Aktuální týden';

            const tables = doc.querySelectorAll('table');
            let menuTable = null;

            for (let table of tables) {
                if (table.innerText.includes('Pondělí') && table.innerText.includes('Přesnídávka')) {
                    menuTable = table;
                    break;
                }
            }

            if (!menuTable) {
                throw new Error('Nepodařilo se najít tabulku s jídelníčkem na webu školky.');
            }

            const rows = menuTable.querySelectorAll('tr');
            const todayName = getTodayName();
            let cardsHtml = '';

            rows.forEach(row => {
                const cells = row.querySelectorAll('td, th');
                if (cells.length >= 4) {
                    const dayRaw = cells[0].innerText.trim();
                    if (['Pondělí', 'Úterý', 'Středa', 'Čtvrtek', 'Pátek'].some(d => dayRaw.includes(d))) {
                        const dayName = dayRaw.replace(':', '').trim();
                        const snackMorning = cleanText(cells[1].innerText);
                        const lunch = cleanText(cells[2].innerText);
                        const snackAfternoon = cleanText(cells[3].innerText);
                        const isToday = dayName.toLowerCase().includes(todayName.toLowerCase());

                        cardsHtml += `
                            <div class="day-card ${isToday ? 'today' : ''}">
                                <div class="day-header">
                                    <h2 class="day-title">${dayName}</h2>
                                    ${isToday ? '<span class="today-badge">Dnes</span>' : ''}
                                </div>
                                <div class="meal-row">
                                    <span class="meal-label">🥣 Přesnídávka</span>
                                    <p class="meal-text">${snackMorning || '—'}</p>
                                </div>
                                <div class="meal-row">
                                    <span class="meal-label">🍲 Oběd</span>
                                    <p class="meal-text">${lunch || '—'}</p>
                                </div>
                                <div class="meal-row">
                                    <span class="meal-label">🍎 Svačina</span>
                                    <p class="meal-text">${snackAfternoon || '—'}</p>
                                </div>
                            </div>
                        `;
                    }
                }
            });

            if (cardsHtml === '') {
                throw new Error('Tabulka byla nalezena, ale neobsahuje dny v týdnu.');
            }

            contentDiv.innerHTML = cardsHtml;

        } catch (error) {
            console.error(error);
            dateRangeDiv.textContent = 'Chyba načítání';
            contentDiv.innerHTML = `
                <div class="error-box">
                    <strong>Nepodařilo se načíst jídelníček.</strong><br><br>
                    <small>Důvod: Prohlížeč v mobilu pravděpodobně zablokoval stažení dat z externího webu (ochrana lokálních souborů) nebo má web školky výpadek.</small><br>
                    <a href="${TARGET_URL}" target="_blank" class="btn-link">Otevřít originální web školky ↗</a>
                </div>
            `;
        }
    }

    loadMenu();
</script>

</body>
</html>
