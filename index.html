<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4f46e5">
<title>Jídelníček MŠ Halasova</title>
<style>
:root{--primary:#4f46e5;--primary-light:#e0e7ff;--bg:#f3f4f6;--text:#1f2937;--muted:#6b7280;--green:#059669}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);margin:0;padding:16px;line-height:1.5}
.container{max-width:680px;margin:auto}
header,.day-card,.status-box,.error-box{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #0000000d}
header{text-align:center}
h1{font-size:1.4rem;color:var(--primary);margin:0 0 8px}
.date-range{display:inline-block;background:var(--primary-light);color:var(--primary);padding:4px 12px;border-radius:20px;font-size:.9rem;font-weight:650}
.meta{font-size:.8rem;color:var(--muted);margin-top:8px}
.day-card{border:2px solid transparent}
.day-card.today{background:#ecfdf5;border-color:#10b981}
.day-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5e7eb;padding-bottom:8px;margin-bottom:12px}
.day-title{font-size:1.12rem;margin:0}
.today-badge{background:var(--green);color:#fff;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:12px}
.meal-row{margin:0 0 11px}
.meal-row:last-child{margin-bottom:0}
.meal-label{display:block;font-size:.78rem;font-weight:750;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.today .meal-label{color:#047857}
.meal-text{margin:0}
.meal-row.interactive{cursor:pointer;padding:8px 10px;margin:0 -10px 8px;border-radius:12px;transition:background-color .15s ease,transform .1s ease;display:flex;justify-content:space-between;align-items:center;gap:10px}
.meal-row.interactive:last-child{margin-bottom:0}
.meal-row.interactive:hover{background:rgba(79,70,229,.06)}
.meal-row.interactive:active{transform:scale(.99);background:rgba(79,70,229,.12)}
.today .meal-row.interactive:hover{background:rgba(5,150,105,.08)}
.today .meal-row.interactive:active{background:rgba(5,150,105,.15)}
.meal-content{flex:1;min-width:0}
.meal-img-hint{flex-shrink:0;font-size:.75rem;font-weight:650;color:var(--primary);background:var(--primary-light);padding:4px 9px;border-radius:10px;white-space:nowrap}
.today .meal-img-hint{color:#047857;background:#d1fae5}
.modal-backdrop{position:fixed;inset:0;background:rgba(17,24,39,.65);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px;z-index:1000}
.modal-backdrop.open{display:flex}
.modal-card{background:#fff;border-radius:20px;max-width:440px;width:100%;padding:20px;box-shadow:0 20px 45px rgba(0,0,0,.28);position:relative;animation:popIn .18s ease-out}
@keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.modal-day-meal{font-size:.78rem;font-weight:750;text-transform:uppercase;color:var(--primary);letter-spacing:.03em}
.modal-title{font-size:1.05rem;font-weight:700;color:var(--text);margin:2px 0 0;line-height:1.35}
.modal-close{background:#f3f4f6;color:var(--text);border:0;width:34px;height:34px;border-radius:50%;font-size:1.1rem;font-weight:700;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:#e5e7eb}
.modal-art-box{background:#f9fafb;border:1px solid #e5e7eb;border-radius:16px;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center;overflow:hidden}
.modal-art-box img{width:100%;max-height:320px;object-fit:cover;border-radius:12px;display:block}
.modal-note{font-size:.76rem;color:var(--muted);margin:10px 0 0;text-align:center}
.modal-actions{display:flex;gap:10px;margin-top:14px}
.btn-secondary{flex:1;background:#eef2ff;color:var(--primary);border:0;padding:11px 14px;border-radius:12px;font-size:.9rem;font-weight:650;cursor:pointer}
.btn-secondary:disabled{opacity:.55}
.status-box{text-align:center;padding:30px 16px}
.spinner{width:34px;height:34px;border:4px solid var(--primary-light);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;text-align:center}
.btn-refresh{display:block;width:100%;background:var(--primary);color:#fff;border:0;padding:14px;font-size:1rem;font-weight:650;border-radius:12px;cursor:pointer;margin:16px 0}
.btn-refresh:disabled{opacity:.6}
.source-link{color:inherit;font-weight:650;display:inline-block;margin-top:10px}
footer{text-align:center;color:var(--muted);font-size:.78rem;margin:14px 0 24px}
</style>
</head>
<body>
<main class="container">
<header><h1>🍽️ Jídelníček MŠ Halasova</h1><div id="date-range" class="date-range">Načítám termín…</div><div id="updated" class="meta">Načítám jídelníček…</div></header>
<div id="content"><div class="status-box"><div class="spinner"></div>Načítám aktuální jídelníček…</div></div>
<button id="refresh" class="btn-refresh" type="button">🔄 Aktualizovat jídelníček</button>
<footer>Zdroj: <a href="https://www.mshalasova.cz/jidelnicek/" target="_blank" rel="noopener">web Mateřské školy Halasova</a> · Automatická aktualizace přes GitHub · Ťuknutím na jídlo zobrazíš obrázek pro děti</footer>
</main>

<div id="meal-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-card">
    <div class="modal-top">
      <div>
        <div id="modal-day-meal" class="modal-day-meal"></div>
        <h2 id="modal-title" class="modal-title"></h2>
      </div>
      <button id="modal-close" class="modal-close" type="button" aria-label="Zavřít">✕</button>
    </div>
    <div id="modal-art-box" class="modal-art-box"></div>
    <p class="modal-note">Orientační obrázek pro děti – skutečná porce ve školce se může lišit.</p>
    <div class="modal-actions">
      <button id="modal-regen" class="btn-secondary" type="button">🎨 Vytvořit jiný obrázek</button>
    </div>
  </div>
</div>

<script>
'use strict';
const TARGET_URL='https://www.mshalasova.cz/jidelnicek/';
const CACHE_KEY='ms-halasova-menu-v7';
const IMG_CACHE_PREFIX='ms-halasova-img-v1:';
const REFRESH_MS=30*60*1000;
const MEALS=['Přesnídávka','Polévka','Oběd','Svačina'];
const $=id=>document.getElementById(id);

let activeMealInfo=null;

function normalize(s){return (s||'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim()}
function cleanMeal(s){
  let t=(s||'').replace(/\u00a0/g,' ');
  t=t.split(/(?:ALERGENY|ALERGÉNY|1\.\s*OBILOVINY|ZMĚNA\s+JÍDELNÍČKU|DOBRÚ\s+CHUŤ|DOBROU\s+CHUŤ|Mateřská\s+škola|Prohlášení\s+o\s+přístupnosti|Seznam\s+alergenů)/i)[0];
  t=t.split(/\n\s*\n/)[0];
  return normalize(t).replace(/\(?\s*A\s*:\s*[^)]*\)?/gi,'').replace(/\(\s*\d+(?:\s*,\s*\d+)*\s*\)/g,'').replace(/[|\s,;]+$/,'').trim();
}
function todayName(){return ['NEDĚLE','PONDĚLÍ','ÚTERÝ','STŘEDA','ČTVRTEK','PÁTEK','SOBOTA'][new Date().getDay()]}
function extractDate(text){const m=text.match(/\b\d{1,2}\.\s*\d{1,2}\.\s*[-–]\s*\d{1,2}\.\s*\d{1,2}\.\s*\d{4}\b/);return m?m[0].replace(/\s+/g,' '):'Aktuální jídelníček'}
function emptyDay(name){return {day:name,meals:{'Přesnídávka':'','Polévka':'','Oběd':'','Svačina':''}}}

function parseMenu(doc){
  doc.querySelectorAll('script,style,noscript,footer,nav').forEach(el=>el.remove());
  const raw=(doc.body?.innerText||doc.body?.textContent||'').replace(/\u00a0/g,' ');
  const date=extractDate(raw);
  const text=raw.replace(/\r/g,'\n');
  const dayRegex=/(PONDĚLÍ|ÚTERÝ|STŘEDA|ČTVRTEK|PÁTEK)\s*/giu;
  const matches=[...text.matchAll(dayRegex)];
  const days=[];
  for(let i=0;i<matches.length;i++){
    const day=matches[i][1].toLocaleUpperCase('cs-CZ');
    if(days.some(x=>x.day===day)) continue;
    const from=matches[i].index+matches[i][0].length;
    const to=i+1<matches.length?matches[i+1].index:text.length;
    const chunk=text.slice(from,to);
    const item=emptyDay(day);
    for(let j=0;j<MEALS.length;j++){
      const label=MEALS[j];
      const pos=chunk.toLocaleLowerCase('cs-CZ').indexOf(label.toLocaleLowerCase('cs-CZ'));
      if(pos<0) continue;
      const valueStart=pos+label.length;
      let valueEnd=chunk.length;
      for(let k=j+1;k<MEALS.length;k++){
        const next=chunk.toLocaleLowerCase('cs-CZ').indexOf(MEALS[k].toLocaleLowerCase('cs-CZ'),valueStart);
        if(next>=0 && next<valueEnd) valueEnd=next;
      }
      item.meals[label]=cleanMeal(chunk.slice(valueStart,valueEnd).replace(/^[\s|:–-]+/,'').replace(/[\s|]+$/,''));
    }
    if(Object.values(item.meals).some(Boolean)) days.push(item);
  }
  if(!days.length) throw new Error('Jídelníček se nepodařilo rozpoznat.');
  return {date,days};
}

async function fetchLocalHtml(){
  const response=await fetch('./menu.txt?t='+Date.now(),{cache:'no-store'});
  if(!response.ok){
    if(response.status===404) throw new Error('Soubor menu.txt zatím neexistuje. Spusť na GitHubu záložku Actions.');
    throw new Error('Chyba při načítání dat (HTTP '+response.status+').');
  }
  const html=await response.text();
  if(html.length<300 || !/PONDĚLÍ|ÚTERÝ|STŘEDA/i.test(html)) throw new Error('Stažený soubor zatím neobsahuje jídelníček.');
  return html;
}

function render(menu,stale=false){
  $('date-range').textContent=menu.date;
  $('updated').textContent=(stale?'Uložený jídelníček · ':'Zobrazeno: ')+(menu.updated||'');
  const host=$('content');host.replaceChildren();
  for(const day of menu.days){const card=document.createElement('section');card.className='day-card'+(day.day===todayName()?' today':'');
    const head=document.createElement('div');head.className='day-header';const title=document.createElement('h2');title.className='day-title';title.textContent=day.day.charAt(0)+day.day.slice(1).toLocaleLowerCase('cs-CZ');head.append(title);
    if(day.day===todayName()){const badge=document.createElement('span');badge.className='today-badge';badge.textContent='Dnes';head.append(badge);}card.append(head);
    for(const meal of MEALS){
      const mealValue=day.meals[meal]||'';
      const row=document.createElement('div');
      const hasMeal=Boolean(mealValue && mealValue!=='—');
      row.className='meal-row'+(hasMeal?' interactive':'');
      const contentWrap=document.createElement('div');
      contentWrap.className='meal-content';
      const label=document.createElement('span');
      label.className='meal-label';
      label.textContent=({'Přesnídávka':'🥣 Přesnídávka','Polévka':'🍵 Polévka','Oběd':'🍲 Oběd','Svačina':'🍎 Svačina'})[meal];
      const value=document.createElement('p');
      value.className='meal-text';
      value.textContent=mealValue||'—';
      contentWrap.append(label,value);
      row.append(contentWrap);
      if(hasMeal){
        const hint=document.createElement('span');
        hint.className='meal-img-hint';
        hint.textContent='🖼️ Obrázek';
        row.append(hint);
        row.addEventListener('click',()=>openMealImageModal(day.day,meal,mealValue));
      }
      card.append(row);
    }
    host.append(card);
  }
}

function buildKidMealPrompt(mealLabel,mealText){
  const cleanText=normalize(mealText);
  return `Cute, friendly children's book illustration showing a neat kid-sized plate or bowl of kindergarten food: ${mealLabel} consisting of "${cleanText}". Warm soft lighting, cheerful colors, clean simple background, appetizing and child-friendly, no text or labels on the image.`;
}

async function generateMealImage(mealLabel,mealText,forceRegenerate=false){
  const cacheKey=IMG_CACHE_PREFIX+mealLabel.toLowerCase()+':'+normalize(mealText).toLowerCase();
  if(!forceRegenerate){
    try{
      const saved=localStorage.getItem(cacheKey);
      if(saved) return saved;
    }catch(_){}
  }

  const prompt=buildKidMealPrompt(mealLabel,mealText);
  const payload={
    contents:[{
      parts:[{text:prompt}]
    }],
    generationConfig:{
      responseModalities:['TEXT','IMAGE']
    }
  };
  const apiKey='';
  const apiUrl=`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite-image:generateContent?key=${apiKey}`;

  let lastError=new Error('Obrázek se nepodařilo vytvořit.');
  for(let attempt=0;attempt<3;attempt++){
    try{
      const response=await fetch(apiUrl,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
      });
      if(!response.ok){
        throw new Error('Chyba služby při tvorbě obrázku (HTTP '+response.status+').');
      }
      const result=await response.json();
      const base64Data=result?.candidates?.[0]?.content?.parts?.find(p=>p.inlineData)?.inlineData?.data;
      if(!base64Data){
        throw new Error('Odpověď neobsahovala obrázek.');
      }
      const imageUrl=`data:image/png;base64,${base64Data}`;
      try{
        localStorage.setItem(cacheKey,imageUrl);
      }catch(_){}
      return imageUrl;
    }catch(err){
      lastError=err;
      if(attempt<2){
        await new Promise(resolve=>setTimeout(resolve,1000*(2**attempt)));
      }
    }
  }
  throw lastError;
}

async function loadAndShowModalImage(forceRegenerate=false){
  if(!activeMealInfo) return;
  const {mealLabel,mealText}=activeMealInfo;
  const artBox=$('modal-art-box');
  const regenBtn=$('modal-regen');
  regenBtn.disabled=true;
  artBox.innerHTML='<div class="spinner"></div><div>Vytvářím obrázek pro děti…</div>';
  try{
    const src=await generateMealImage(mealLabel,mealText,forceRegenerate);
    artBox.replaceChildren();
    const img=document.createElement('img');
    img.src=src;
    img.alt=mealText;
    artBox.append(img);
  }catch(err){
    artBox.replaceChildren();
    const p=document.createElement('p');
    p.style.color='#991b1b';
    p.style.margin='0';
    p.textContent=err?.message||'Obrázek se nepodařilo načíst.';
    artBox.append(p);
  }finally{
    regenBtn.disabled=false;
  }
}

function openMealImageModal(dayNameUpper,mealLabel,mealText){
  const formattedDay=dayNameUpper.charAt(0)+dayNameUpper.slice(1).toLocaleLowerCase('cs-CZ');
  activeMealInfo={dayName:formattedDay,mealLabel,mealText};
  $('modal-day-meal').textContent=`${formattedDay} · ${mealLabel}`;
  $('modal-title').textContent=mealText;
  $('meal-modal').classList.add('open');
  loadAndShowModalImage(false);
}

function closeMealImageModal(){
  $('meal-modal').classList.remove('open');
  activeMealInfo=null;
}

$('modal-close').addEventListener('click',closeMealImageModal);
$('modal-regen').addEventListener('click',()=>loadAndShowModalImage(true));
$('meal-modal').addEventListener('click',e=>{
  if(e.target===$('meal-modal')) closeMealImageModal();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && $('meal-modal').classList.contains('open')) closeMealImageModal();
});

async function loadMenu(){
  const btn=$('refresh');
  btn.disabled=true;
  btn.textContent='⏳ Načítám…';
  $('content').innerHTML='<div class="status-box"><div class="spinner"></div>Načítám aktuální jídelníček…</div>';
  try{
    const html=await fetchLocalHtml();
    const doc=new DOMParser().parseFromString(html,'text/html');
    const menu=parseMenu(doc);
    menu.updated=new Date().toLocaleString('cs-CZ');
    try{localStorage.setItem(CACHE_KEY,JSON.stringify(menu));}catch(_){}
    render(menu,false);
  }catch(error){
    console.error(error);
    let cached=null;
    try{cached=localStorage.getItem(CACHE_KEY);}catch(_){}
    if(cached){
      try{
        render(JSON.parse(cached),true);
        const note=document.createElement('p');
        note.className='meta';
        note.textContent='Novější jídelníček se nepodařilo načíst. Zobrazuji poslední uložená data.';
        $('content').prepend(note);
      }catch(_){showError(error);}
    }else showError(error);
  }finally{
    btn.disabled=false;
    btn.textContent='🔄 Aktualizovat jídelníček';
  }
}

function showError(error){
  $('date-range').textContent='Načtení se nezdařilo';
  $('updated').textContent='';
  const box=document.createElement('div');
  box.className='error-box';
  const strong=document.createElement('strong');
  strong.textContent='Jídelníček se nepodařilo načíst.';
  const p=document.createElement('p');
  p.textContent=error?.message||'Neznámá chyba.';
  const a=document.createElement('a');
  a.className='source-link';
  a.href=TARGET_URL;
  a.target='_blank';
  a.rel='noopener';
  a.textContent='Otevřít originální web školky ↗';
  box.append(strong,p,a);
  $('content').replaceChildren(box);
}

$('refresh').addEventListener('click',loadMenu);
loadMenu();
setInterval(()=>{if(document.visibilityState==='visible')loadMenu();},REFRESH_MS);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadMenu();});
</script>
</body>
</html>
