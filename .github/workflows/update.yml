name: Aktualizace jídelníčku
​on:
schedule:
# Spustí se automaticky každých 30 minut ve všední dny (6:00 - 16:00)
- cron: '*/30 5-15 * * 1-5'
workflow_dispatch: # Umožní ruční spuštění tlačítkem na GitHubu
​permissions:
contents: write
​jobs:
fetch-menu:
runs-on: ubuntu-latest
steps:
- name: Stažení repozitáře
uses: actions/checkout@v4
​- name: Stažení stránky z webu školky
run: |
curl -s -L -A "Mozilla/5.0" "https://www.mshalasova.cz/jidelnicek/" -o jidelnicek.html
​- name: Uložení souboru do repozitáře
run: |
git config user.name "github-actions[bot]"
git config user.email "github-actions[bot]@users.noreply.github.com"
git add jidelnicek.html
git diff --staged --quiet || (git commit -m "Aktualizace jídelníčku" && git push)
